name: Docker Build and Push

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # Build and Push Docker Image
  # ==========================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean up Docker and free disk space
      run: |
        # Show current disk usage
        echo "=== Disk usage before cleanup ==="
        df -h
        echo ""
        
        # Remove all unused Docker images, containers, and caches aggressively
        echo "=== Cleaning up Docker ==="
        docker system df
        docker builder prune -af --filter "until=1h"  # Remove caches older than 1 hour
        docker image prune -af
        docker container prune -f
        docker volume prune -f
        
        # Remove any dangling images
        docker rmi $(docker images -f "dangling=true" -q) 2>/dev/null || true
        
        # Clean up Docker cache more aggressively
        docker builder prune -f --all
        
        # Remove any unused networks
        docker network prune -f
        
        # Show disk usage after cleanup
        echo ""
        echo "=== Disk usage after cleanup ==="
        df -h
        echo ""
        docker system df

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix=,suffix=,format=short

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64
        load: true
        build-args: |
          PIP_CACHE_DIR=/tmp/pip-cache
        # Reduce disk usage during build
        no-cache: false

    - name: Clean up Docker cache after build
      if: always()
      run: |
        docker system df
        docker builder prune -af
        docker image prune -af
        docker system df

  # ==========================================
  # Security Scan Docker Image
  # ==========================================
  scan-image:
    name: Scan Docker Image
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
    - name: Pull the built image
      run: |
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true

    - name: Run Trivy vulnerability scanner
      if: false  # Disable Trivy for now - can be enabled when Docker build works
      run: echo "Trivy scan disabled"

    - name: Upload scan results
      if: false  # Disable for now
      run: echo "Skipping SARIF upload"
