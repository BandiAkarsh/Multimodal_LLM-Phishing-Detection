[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-detection"
version = "2.0.0"
description = "AI-powered phishing detection system with multi-modal analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Akarsh", email = "akarshbandi82@gmail.com"}
]
keywords = ["phishing", "security", "ml", "ai", "cybersecurity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/BandiAkarsh/phishing-detection"
Documentation = "https://github.com/BandiAkarsh/phishing-detection/tree/main/docs"
Repository = "https://github.com/BandiAkarsh/phishing-detection.git"
Issues = "https://github.com/BandiAkarsh/phishing-detection/issues"

# ==========================================
# Black Configuration
# ==========================================
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | mlruns
  | 01_data
  | 02_models
  | 06_notebooks
  | browser-extension
  | gui-tauri
)/
'''

# ==========================================
# isort Configuration
# ==========================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["04_inference", "05_utils"]

# ==========================================
# flake8 Configuration
# ==========================================
[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",  # Whitespace before ':'
    "W503",  # Line break before binary operator
    "E501",  # Line too long (handled by black)
]
per-file-ignores = [
    "__init__.py:F401",  # Unused imports in __init__.py files
    "test_*.py:D100,D101,D102",  # Missing docstrings in tests
]
select = ["E9", "F63", "F7", "F82"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    "venv",
    ".tox",
    "mlruns",
    "01_data",
    "02_models",
]

# ==========================================
# mypy Configuration
# ==========================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true for stricter checking
disallow_incomplete_defs = false
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "sklearn.*",
    "pandas.*",
    "numpy.*",
    "playwright.*",
    "PIL.*",
]
ignore_missing_imports = true

# ==========================================
# Bandit Configuration
# ==========================================
[tool.bandit]
exclude_dirs = ["tests", "test_", "venv", ".venv", "mlruns"]
skips = [
    "B101",  # assert_used (fine in tests)
    "B311",  # random (not cryptographically secure)
]

# ==========================================
# Pytest Configuration
# ==========================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "security: marks tests as security tests",
]

# ==========================================
# Coverage Configuration
# ==========================================
[tool.coverage.run]
source = ["04_inference", "05_utils"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/venv/*",
    "*/.venv/*",
    "*/mlruns/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

# ==========================================
# Pylint Configuration
# ==========================================
[tool.pylint.messages_control]
disable = [
    "C0103",  # invalid-name
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "W0703",  # broad-except
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-locals = 20
