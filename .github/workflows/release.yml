name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ==========================================
  # Create Release
  # ==========================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        body: |
          ## Phishing Guard Desktop v1.0.0
          
          A standalone phishing detection desktop application that runs in the background.
          
          ### Features:
          - Background email scanning (Thunderbird + OAuth)
          - System tray support
          - Real-time phishing detection
          - Same 4-tier detection as parent project
          
          ### Quick Start:
          ```bash
          chmod +x phishing-guard-desktop
          ./phishing-guard-desktop
          ```
        draft: false
        prerelease: false

  # ==========================================
  # Build and Attach Assets
  # ==========================================
  build-assets:
    name: Build Release Assets
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create source archive
      run: |
        echo "Creating source archive..."
        tar --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='mlruns' \
            -czf phishing-guard-source.tar.gz .
        echo "Archive created"
        ls -la phishing-guard-source.tar.gz

    - name: Upload source archive
      uses: softprops/action-gh-release@v1
      with:
        files: phishing-guard-source.tar.gz
