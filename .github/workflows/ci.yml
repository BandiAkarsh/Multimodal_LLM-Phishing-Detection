name: CI - Test, Lint, and Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Add permissions for CodeQL and security scanning
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ==========================================
  # Job 1: Code Quality Checks
  # ==========================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 isort mypy pylint bandit
        pip install -r requirements.txt

    - name: Check code formatting with black
      run: |
        black --check --diff 04_inference/ 05_utils/ detect_enhanced.py email_scanner.py || true

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff 04_inference/ 05_utils/ || true

    - name: Lint with flake8
      run: |
        flake8 04_inference/ 05_utils/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 04_inference/ 05_utils/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type checking with mypy
      run: |
        mypy 04_inference/ 05_utils/ --ignore-missing-imports || true

    - name: Security lint with bandit
      run: |
        bandit -r 04_inference/ 05_utils/ -f json -o bandit-report.json || true
        bandit -r 04_inference/ 05_utils/ || true

  # ==========================================
  # Job 2: Run Tests
  # ==========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio pytest-mock
        pip install -r requirements.txt

    - name: Run security tests
      run: |
        pytest test_security.py -v --tb=short || true

    - name: Run comprehensive tests
      run: |
        pytest test_comprehensive.py -v --tb=short || true

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=04_inference --cov=05_utils --cov-report=xml --cov-report=html || true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # ==========================================
  # Job 3: Security Scanning
  # ==========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for proper commit scanning

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Check for secrets with GitLeaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Note: Don't use continue-on-error for secrets detection
      # Secrets should cause build failures to prevent leakage

    - name: Dependency vulnerability scan
      run: |
        pip install safety
        safety check -r requirements.txt || true

  # ==========================================
  # Job 4: Docker Build Test
  # ==========================================
  docker-build:
    name: Test Docker Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: phishing-guard:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm phishing-guard:test python --version
        docker images phishing-guard:test

  # ==========================================
  # Job 5: Browser Extension Validation
  # ==========================================
  validate-extension:
    name: Validate Browser Extension
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate manifest.json
      run: |
        cd browser-extension
        if [ ! -f manifest.json ]; then
          echo "Error: manifest.json not found"
          exit 1
        fi
        # Check if manifest is valid JSON
        python3 -c "import json; json.load(open('manifest.json'))"
        echo "✓ manifest.json is valid JSON"

    - name: Check extension structure
      run: |
        cd browser-extension
        for file in manifest.json content.js popup.html styles.css icons/; do
          if [ ! -e "$file" ]; then
            echo "Warning: $file not found"
          else
            echo "✓ Found: $file"
          fi
        done
